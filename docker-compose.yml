version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: actor-agent-postgres
    environment:
      POSTGRES_USER: actor_admin
      POSTGRES_PASSWORD: actor_pass_2026_secure
      POSTGRES_DB: actor_agent
    volumes:
      - actor_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actor_admin -d actor_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: actor-agent-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://actor_admin:actor_pass_2026_secure@postgres:5432/actor_agent
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-actor-agent-secret-key-2026}
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_API_KEY: ${LLM_API_KEY:-sk-71d6862512e54c649f02560b77e7e52b}
      LLM_MODEL: deepseek-chat
    ports:
      - "8080:8080"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: actor-agent-redis
    restart: unless-stopped

volumes:
  actor_postgres_data:
